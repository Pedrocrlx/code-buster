[project]
name = "buster"
version = "0.1.0"
description = "buster using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
buster = "buster.main:run"
run_crew = "buster.main:run"
train = "buster.main:train"
replay = "buster.main:replay"
test = "buster.main:test"
run_with_trigger = "buster.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[project]
name = "code-buster"
version = "0.1.1"
description = "Code Buster CLI - Helping developers everyday"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai>=0.5.0",
    "httpx>=0.28.1",
    "typer>=0.23.1",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F401"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"

[project.scripts]
buster = "main:app"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.15.12",
]

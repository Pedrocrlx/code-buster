[project]
name = "code-buster"
version = "0.1.9"
description = "Code Buster CLI - Helping developers everyday"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai>=0.5.0",
    "typer>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["src/buster/AI", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = true

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F401"]

[tool.ruff]
src = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["config/*.yaml", "stop_words.md"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"

[project.scripts]
buster = "CLI.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.15.12",
]
